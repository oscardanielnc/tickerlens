server {
    listen 80;
    server_name _;

    # Real client IP reaches the backend so per-IP rate limiting works.
    # X-Forwarded-For is set to $remote_addr, NOT $proxy_add_x_forwarded_for:
    # the latter appends to whatever the client sent, and the backend reads the
    # first entry — so a visitor could send their own X-Forwarded-For and pick
    # their own rate-limit bucket. We are the only trusted hop, so we overwrite.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # The AI narrative is streamed over SSE — never buffer it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
