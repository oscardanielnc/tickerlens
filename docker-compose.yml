services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tickerlens
      POSTGRES_PASSWORD: tickerlens
      POSTGRES_DB: tickerlens
    # Loopback only: the password below is a well-known dev default, so the port
    # must not be reachable from the network. Prod has no db service at all.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickerlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tickerlens:tickerlens@db:5432/tickerlens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
